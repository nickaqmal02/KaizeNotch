# Pushing a tag like v0.1.0 builds the Windows app and publishes a GitHub Release with:
#   KaizeNotch_<version>_x64_en-US.msi      installer
#   KaizeNotch_<version>_x64-setup.exe      installer (smaller, no admin needed)
#   KaizeNotch_<version>_x64_portable.zip   just the .exe, for Scoop
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - name: The tag must match the app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in tauri.conf.json"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Tests
        run: cargo test
        working-directory: src-tauri
      - name: Build the app and its installers
        run: npx tauri build
      - name: Portable zip (for Scoop)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/kaizenotch.exe portable/KaizeNotch.exe
          Copy-Item LICENSE portable/LICENSE.txt
          Compress-Archive -Path portable/* -DestinationPath "KaizeNotch_${env:VERSION}_x64_portable.zip"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum KaizeNotch_${VERSION}_x64_portable.zip src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe | sed 's|src-tauri/target/release/bundle/[a-z]*/||' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "KaizeNotch $VERSION" --generate-notes \
            src-tauri/target/release/bundle/msi/*.msi \
            src-tauri/target/release/bundle/nsis/*.exe \
            "KaizeNotch_${VERSION}_x64_portable.zip" \
            SHA256SUMS.txt
