<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f26"/><stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2fb36b"/><stop offset="1" stop-color="#7be0a4"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- the pill at the top: the notch -->
  <rect x="312" y="150" width="400" height="92" rx="46" fill="#f4f5f7"/>
  <circle cx="368" cy="196" r="20" fill="#2fb36b"/>
  <!-- rising steps: 1% better every day -->
  <rect x="262" y="640" width="120" height="160" rx="22" fill="url(#up)" opacity="0.55"/>
  <rect x="452" y="520" width="120" height="280" rx="22" fill="url(#up)" opacity="0.78"/>
  <rect x="642" y="380" width="120" height="420" rx="22" fill="url(#up)"/>
</svg>
