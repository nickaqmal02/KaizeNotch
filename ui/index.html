<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaizeNotch</title>
  <link rel="stylesheet" href="style.css?v=0.1.5">
</head>
<body>
  <!-- ?v= must be the app version: Windows keeps old copies of these files otherwise (a test checks it) -->
  <!-- The pill (always) and the panel (on hover). app.js fills both. -->
  <main id="notch" class="collapsed">
    <div id="pill" aria-live="polite"></div>
    <section id="panel" aria-label="KaizeNotch"></section>
  </main>
  <script src="app.js?v=0.1.5"></script>
</body>
</html>
